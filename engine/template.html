<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>{{PAGE_TITLE}}</title>
<style>
{{CSS}}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to the consultation</a>
<header class="case-header">
  <div class="inner">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M16 4v22M10 27h12M5 9h22M5 9l-4 9M5 9l4 9M27 9l-4 9M27 9l4 9M1 18a4 2.5 0 0 0 8 0M23 18a4 2.5 0 0 0 8 0"/></svg>
      <div>
        <p class="eyebrow">{{EYEBROW}}</p>
        <h1 class="case-title">{{CASE_TITLE}}</h1>
      </div>
    </div>
    <a href="../">Back to all cases</a>
  </div>
</header>
<div class="layout">
  <nav class="progress" id="progress" aria-label="Consultation sections"></nav>
  <main class="panel" id="main" tabindex="-1"></main>
</div>
<footer class="site-footer">
  <p>Answers stay in this browser unless you download your report. Using a shared computer? <button type="button" class="link-button" id="clear-saved">Clear my saved answers</button></p>
</footer>
<div class="visually-hidden" id="live" aria-live="polite"></div>
<script id="ethos-case" type="application/json">{{CASE_JSON}}</script>
<script>
{{ENGINE}}
</script>
</body>
</html>
