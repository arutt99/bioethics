                clearLocalStorageCallback: null,
            };

            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);
            const input = document.getElementById("staticrypt-password");
            const errorBox = document.getElementById("ethos-error");
            const toggle = document.getElementById("ethos-toggle");

            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
                if (!isSuccessful) {
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    if (isRememberEnabled) {
                        document.getElementById("staticrypt-remember-label").classList.remove("hidden");
                    }
                    input.focus();
                }
            };

            toggle.addEventListener("click", function () {
                const show = input.type === "password";
                input.type = show ? "text" : "password";
                toggle.textContent = show ? "Hide code" : "Show code";
                toggle.setAttribute("aria-pressed", show ? "true" : "false");
                input.focus();
            });

            input.addEventListener("input", function () {
                if (errorBox.textContent) {
                    errorBox.textContent = "";
                    input.removeAttribute("aria-invalid");
                }
            });

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();
                const password = input.value;
                if (!password.trim()) {
                    errorBox.textContent = "Enter the access code for this activity.";
                    input.setAttribute("aria-invalid", "true");
                    input.focus();
                    return;
                }
                errorBox.textContent = "";
                const isRememberChecked = document.getElementById("staticrypt-remember").checked;
                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
                if (!isSuccessful) {
                    // Keep the entered code so the student can correct a typo.
                    errorBox.textContent = templateError;
                    input.setAttribute("aria-invalid", "true");
                    input.focus();
                }
            });
        </script>
    </body>
</html>
