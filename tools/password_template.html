<!DOCTYPE html>
<html lang="en" class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>/*[|template_title|]*/0</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <!-- The policy stays in force after decryption: the activity cannot load or send anything off the page. -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" />
        <meta name="referrer" content="no-referrer" />
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="pragma" content="no-cache" />
        <!-- ETHOS code prompt, adapted from StatiCrypt's default template (StatiCrypt 3.5.4). -->
        <style>
            :root {
                --bg: #f4f6f8;
                --surface: #ffffff;
                --text: #17212b;
                --text-muted: #4b5563;
                --navy: #174d68;
                --navy-dark: #10384c;
                --teal: #0f6e6e;
                --border: #d1d8e0;
                --error: #a3261b;
            }
            * {
                box-sizing: border-box;
            }
            .staticrypt-body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font-family: system-ui, "Segoe UI", Arial, sans-serif;
                font-size: 1.0625rem;
                line-height: 1.5;
            }
            .hidden {
                display: none !important;
            }
            :focus-visible {
                outline: 3px solid var(--teal);
                outline-offset: 2px;
            }
            .ethos-header {
                background: var(--navy);
                color: #ffffff;
                padding: 16px;
            }
            .ethos-header a {
                color: #ffffff;
                font-weight: 600;
            }
            .ethos-page {
                max-width: 30rem;
                margin: 32px auto;
                padding: 0 16px;
            }
            .ethos-card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-top: 4px solid var(--teal);
                border-radius: 8px;
                padding: 24px;
            }
            .ethos-card h1 {
                margin: 0 0 8px;
                font-size: 1.5rem;
                line-height: 1.25;
            }
            .ethos-instructions {
                margin: 0 0 16px;
                color: var(--text-muted);
            }
            label.ethos-label {
                display: block;
                font-weight: 600;
                margin-bottom: 8px;
            }
            .ethos-input-row {
                display: flex;
                gap: 8px;
            }
            #staticrypt-password {
                flex: 1 1 auto;
                min-width: 0;
                font: inherit;
                font-size: 1rem;
                padding: 10px 12px;
                min-height: 44px;
                border: 1px solid #8a96a3;
                border-radius: 8px;
                color: var(--text);
                background: #ffffff;
            }
            #staticrypt-password[aria-invalid="true"] {
                border-color: var(--error);
            }
            .ethos-toggle {
                flex: 0 0 auto;
                font: inherit;
                font-size: 0.9375rem;
                min-height: 44px;
                padding: 8px 12px;
                border: 1px solid var(--border);
                border-radius: 8px;
                background: #ffffff;
                color: var(--navy);
                cursor: pointer;
            }
            .ethos-error {
                color: var(--error);
                font-weight: 600;
                margin: 8px 0 0;
                min-height: 1.5em;
            }
            .staticrypt-decrypt-button {
                margin-top: 16px;
                width: 100%;
                font: inherit;
                font-weight: 600;
                min-height: 44px;
                padding: 10px 16px;
                border: 0;
                border-radius: 8px;
                background: var(--navy);
                color: #ffffff;
                cursor: pointer;
            }
            .staticrypt-decrypt-button:hover {
                background: var(--navy-dark);
            }
            .ethos-note {
                margin: 16px 0 0;
                font-size: 0.9375rem;
                color: var(--text-muted);
            }
            .staticrypt-spinner-container {
                padding: 64px 16px;
                text-align: center;
                color: var(--text-muted);
            }
        </style>
    </head>
    <body class="staticrypt-body">
        <header class="ethos-header">
            <a href="../index.html">&larr; Back to all activities</a>
        </header>

        <div id="staticrypt_loading" class="staticrypt-spinner-container">Loading&hellip;</div>

        <main id="staticrypt_content" class="ethos-page hidden">
            <div class="ethos-card">
                <h1>/*[|template_title|]*/0</h1>
                <p class="ethos-instructions">/*[|template_instructions|]*/0</p>
                <form id="staticrypt-form" action="#" method="post" novalidate>
                    <label class="ethos-label" for="staticrypt-password">/*[|template_placeholder|]*/0</label>
                    <div class="ethos-input-row">
                        <input
                            id="staticrypt-password"
                            type="password"
                            name="password"
                            autocomplete="off"
                            autocapitalize="off"
                            spellcheck="false"
                            aria-describedby="ethos-error"
                        />
                        <button type="button" id="ethos-toggle" class="ethos-toggle" aria-pressed="false">
                            Show code
                        </button>
                    </div>
                    <p id="ethos-error" class="ethos-error" role="alert" aria-live="assertive"></p>
                    <label id="staticrypt-remember-label" class="hidden">
                        <input id="staticrypt-remember" type="checkbox" name="remember" />
                        /*[|template_remember|]*/0
                    </label>
                    <button type="submit" class="staticrypt-decrypt-button">/*[|template_button|]*/0</button>
                </form>
                <p class="ethos-note">The code is checked in your browser. You will need to enter it again if you reload this page.</p>
            </div>
        </main>

        <script>
            // Filled in by StatiCrypt when the file is generated; the template format is '/*[|variable_name|]*/0'.
            const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
            const templateError = "/*[|template_error|]*/0",
                isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
                staticryptConfig = /*[|staticrypt_config|]*/ 0;

            const templateConfig = {
                rememberExpirationKey: "staticrypt_expiration",
                rememberPassphraseKey: "staticrypt_passphrase",
                replaceHtmlCallback: null,
                clearLocalStorageCallback: null,
            };

            const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);
            const input = document.getElementById("staticrypt-password");
            const errorBox = document.getElementById("ethos-error");
            const toggle = document.getElementById("ethos-toggle");

            window.onload = async function () {
                const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
                if (!isSuccessful) {
                    document.getElementById("staticrypt_loading").classList.add("hidden");
                    document.getElementById("staticrypt_content").classList.remove("hidden");
                    if (isRememberEnabled) {
                        document.getElementById("staticrypt-remember-label").classList.remove("hidden");
                    }
                    input.focus();
                }
            };

            toggle.addEventListener("click", function () {
                const show = input.type === "password";
                input.type = show ? "text" : "password";
                toggle.textContent = show ? "Hide code" : "Show code";
                toggle.setAttribute("aria-pressed", show ? "true" : "false");
                input.focus();
            });

            input.addEventListener("input", function () {
                if (errorBox.textContent) {
                    errorBox.textContent = "";
                    input.removeAttribute("aria-invalid");
                }
            });

            document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
                e.preventDefault();
                const password = input.value;
                if (!password.trim()) {
                    errorBox.textContent = "Enter the access code for this activity.";
                    input.setAttribute("aria-invalid", "true");
                    input.focus();
                    return;
                }
                errorBox.textContent = "";
                const isRememberChecked = document.getElementById("staticrypt-remember").checked;
                const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);
                if (!isSuccessful) {
                    // Keep the entered code so the student can correct a typo.
                    errorBox.textContent = templateError;
                    input.setAttribute("aria-invalid", "true");
                    input.focus();
                }
            });
        </script>
    </body>
</html>
